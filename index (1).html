<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ابزارهای پور گلد (نسخه‌ی آزمایشی)</title>
<style>
:root{--bg:#f3e8c8;--card:#fffaf0;--ink:#2a2108;--gold:#c8961f;--brown:#6f5116}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17130a;--card:#2a2210;--ink:#f3e3b0}}
:root[data-theme="dark"]{--bg:#17130a;--card:#2a2210;--ink:#f3e3b0}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:Tahoma,'Vazirmatn',sans-serif;padding:24px 16px}
main{max-width:760px;margin:0 auto}
h1{font-size:clamp(30px,7vw,48px);color:var(--gold);margin:12px 0 4px}
p.sub{margin:0 0 24px;opacity:.85}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
a.card{display:block;background:var(--card);border:1px solid #b8892b;border-radius:14px;padding:18px;color:inherit;text-decoration:none}
a.card:hover{box-shadow:0 4px 14px rgba(0,0,0,.2)}
a.card b{display:block;font-size:18px;color:var(--brown);margin-bottom:6px}
.note{margin-top:28px;font-size:13px;opacity:.7}
</style>
</head>
<body>
<main>
 <h1>پور گلد</h1>
 <p class="sub">ابزارهای طلا و جواهر</p>
 <div class="grid">
  <a class="card" href="invoice.html"><b>فاکتورساز طلا</b>ساخت و چاپ فاکتور با محاسبه‌ی خودکار اجرت، سود و مالیات.</a>
 </div>
 <p class="note">نسخه‌ی آزمایشی. ابزارهای بیشتر به‌زودی اضافه می‌شوند.</p>
</main>
</body>
</html>
